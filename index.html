<style>
:root{
  --bg:#EDEEF0; --card:#FFFFFF; --ink:#20262B; --soft:#6C757D; --line:#DFE2E5;
  --accent:#2F6F62; --accent-soft:#E6EFEC; --ochre:#8A7458; --ochre-soft:#F1EDE5;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-weight:400; font-size:16px; line-height:1.7;
  padding-bottom:96px;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 0}
h1{font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--soft);margin:0 0 20px}
h2{font-size:15px;font-weight:500;margin:0}
.muted{color:var(--soft);font-size:14px}
.screen{display:none}
.screen.on{display:block}

.now{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:32px 24px;min-height:300px;display:flex;flex-direction:column;justify-content:center;
}
.nowLabel{font-size:13px;color:var(--accent);font-weight:500;margin-bottom:14px}
.nowTitle{font-size:26px;font-weight:500;line-height:1.45;margin:0 0 20px}
.step{
  background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin-bottom:24px;
  font-size:15px;line-height:1.6;
}
.step b{display:block;font-size:12px;font-weight:500;color:var(--accent);margin-bottom:4px}
.timer{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;margin:0 0 20px;color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap}

button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;transition:opacity .15s}
button:active{opacity:.65}
.b{background:transparent;border:1px solid var(--line);color:var(--ink);padding:11px 18px}
.b.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.b.quiet{border:none;color:var(--soft);padding:11px 6px}
.b.small{font-size:13px;padding:7px 12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.tick{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:50%;
  flex:0 0 auto;margin-top:3px;cursor:pointer
}
.tick.on{background:var(--accent);border-color:var(--accent)}
.itemBody{flex:1;min-width:0}
.itemTitle{font-size:15px;line-height:1.5}
.itemTitle.done{color:var(--soft);text-decoration:line-through}
.itemSub{font-size:13px;color:var(--soft);margin-top:2px}
.flag{display:inline-block;font-size:12px;color:var(--ochre);background:var(--ochre-soft);border-radius:6px;padding:1px 8px;margin-top:5px}
.dots{border:none;background:none;color:var(--soft);font-size:18px;padding:0 4px;cursor:pointer;line-height:1}
.empty{color:var(--soft);font-size:14px;padding:14px 0}
.dayNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dayNavMid{text-align:center;font-size:15px;font-weight:500;flex:1}
.navArrow{border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;margin-bottom:14px}
.chips:last-child{margin-bottom:0}
.ctxLabel{font-size:12px;color:var(--soft);font-weight:500;margin:0 0 6px}
.chip{background:var(--accent-soft);border:1px solid var(--accent-soft);color:var(--accent);
  border-radius:20px;padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.search{margin-bottom:10px}
.dayAdd{border:none;background:none;color:var(--accent);font-size:22px;font-weight:300;
  padding:0 6px;cursor:pointer;line-height:1}
.dayRow{display:flex;justify-content:space-between;align-items:center;gap:8px}

.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-top:10px}
.day.today{border-color:var(--accent)}
.dayHead{display:flex;justify-content:space-between;align-items:baseline}
.dayName{font-size:15px;font-weight:500}

.fab{
  position:fixed;bottom:88px;inset-inline-end:calc(50% - 260px + 18px);
  width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;
  font-size:26px;font-weight:300;line-height:1;box-shadow:0 3px 14px rgba(32,38,43,.16)
}
@media(max-width:560px){.fab{inset-inline-end:18px}}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line)}
.navIn{max-width:520px;margin:0 auto;display:flex;padding:8px 0 22px}
.nb{flex:1;border:none;background:none;color:var(--soft);font-size:12px;padding:8px 0}
.nb.on{color:var(--accent);font-weight:500}

.sheetWrap{display:none;position:fixed;inset:0;background:rgba(32,38,43,.34);z-index:20;align-items:flex-end;justify-content:center}
.sheetWrap.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:24px 20px 34px}
.sheet h3{font-size:17px;font-weight:500;margin:0 0 4px}
label{display:block;font-size:13px;color:var(--soft);margin:16px 0 6px}
input,textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px
}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.stack .b{width:100%;padding:13px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
</style>

let S=load(), view=today(), timer=null, tSec=0, tId=null;

function today(){const d=new Date();d.setHours(d.getHours()-DAY_START);return iso(d)}
function shiftDay(ds,n){const d=parse(ds);d.setDate(d.getDate()+n);return iso(d)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.tasks){if(!x.templates)x.templates=SEED.templates;x.templates.forEach((t,i)=>{if(t.tracked===undefined)t.tracked=false;if(t.order===undefined)t.order=i});if(!x.nextPhases)x.nextPhases=[];return x}}catch(e){}return JSON.parse(JSON.stringify(SEED))}
let _lastSave=0;
function save(){
  _lastSave=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(window._fbReady)db.ref(FB_PATH).set(S).catch(function(e){console.warn('sync save:',e)});
}
function find(id){return S.tasks.find(t=>t.id===id)}
function say(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1600)}

function ofDay(d,kind){return S.tasks.filter(t=>t.date===d&&t.kind===kind&&t.status!=='trash')}
function core(d){return ofDay(d,'core')}
function extra(d){return ofDay(d,'extra')}
function inbox(){return S.tasks.filter(t=>t.kind==='inbox'&&t.status!=='trash'&&t.status!=='done')}
function waiting(){return S.tasks.filter(t=>t.kind==='waiting'&&t.status!=='trash'&&t.status!=='done')}
function pinnedWaiting(){return waiting().find(t=>t.pinned)||null}
function current(){return core(view).find(t=>t.status!=='done')||extra(view).find(t=>t.status!=='done')||null}

function go(n,el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+n).classList.add('on');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  if(el)el.classList.add('on');
  window.scrollTo(0,0);
}

function render(){renderToday();renderBox();renderWeek();renderLog();renderProgress()}

function clock(){const m=String(Math.floor(tSec/60)).padStart(2,'0'),s=String(tSec%60).padStart(2,'0');return m+':'+s}

function renderToday(){
  const d=parse(view), t=current(), c=core(view), e=extra(view);
  const left=c.filter(x=>x.status!=='done').length;
  let now;
  if(t){
    now='<div class="now"><div class="nowLabel">دلوقتي</div>'+
      '<div class="nowTitle">'+esc(t.title)+'</div>'+
      (t.note?'<div class="muted" style="margin:-8px 0 20px">'+esc(t.note)+'</div>':'')+
      (t.step?'<div class="step"><b>الخطوة الأولى</b>'+esc(t.step)+'</div>':'')+
      (tId===t.id?'<div class="timer">'+clock()+'</div>':'')+
      '<div class="row">'+
        (tId===t.id
          ? '<button class="b main" onclick="stop()">وقف المؤقت</button>'
          : '<button class="b main" onclick="start(\''+t.id+'\')">ابدأ</button>')+
        '<button class="b" onclick="done(\''+t.id+'\')">خلصت</button>'+
        '<button class="b quiet" onclick="later(\''+t.id+'\')">دلوقتي لأ</button>'+
      '</div></div>';
  }else{
    now='<div class="now"><div class="nowLabel">دلوقتي</div>'+
      '<div class="nowTitle">مفيش حاجة مطلوبة منك.</div>'+
      '<div class="muted">لو عايز تضيف مهمة لليوم، اضغط الزرار الأخضر تحت.</div></div>';
  }

  const pw=pinnedWaiting();
  const pinBlock=pw?'<div class="card" style="margin-top:0"><div class="head"><h2>مستني رد</h2></div>'+
    '<div class="itemTitle">'+esc(pw.title)+'</div>'+
    (pw.note?'<div class="itemSub">'+esc(pw.note)+'</div>':'')+
    '<div class="row" style="margin-top:12px">'+
      '<button class="b main" onclick="waitReceived(\''+pw.id+'\')">استلمتها</button>'+
      '<button class="b" onclick="waitToTask(\''+pw.id+'\')">حوّلها لمهمة</button>'+
    '</div></div>':'';
  const isToday=view===today();
  const nav='<div class="dayNav">'+
    '<button class="navArrow" onclick="jump(\''+shiftDay(view,-1)+'\')" aria-label="اليوم اللي فات">‹</button>'+
    '<div class="dayNavMid">'+dayLabel(view)+
      (isToday?'':'<button class="b small" style="margin-top:6px" onclick="jump(\''+today()+'\')">ارجع للنهارده</button>')+
    '</div>'+
    '<button class="navArrow" onclick="jump(\''+shiftDay(view,1)+'\')" aria-label="اليوم اللي بعده">›</button>'+
  '</div>';
  let s=pinBlock+nav+now;
  s+='<div class="card"><div class="head"><h2>الأساسي</h2><span class="muted">'+left+' من '+c.length+'</span></div>';
  s+= c.length? c.map(row).join('') : '<div class="empty">مفيش مهام أساسية النهارده.</div>';
  if(c.length<2) s+='<div style="margin-top:12px"><button class="b small" onclick="add(\'core\')">+ مهمة أساسية</button></div>';
  else s+='<div class="empty" style="padding-bottom:0">وصلت للحد الأقصى. عشان تضيف تالتة، شيل واحدة.</div>';
  s+='</div>';

  s+='<div class="card"><div class="head"><h2>إضافي</h2><span class="muted">مش لازم</span></div>';
  s+= e.length? e.map(row).join('') : '<div class="empty">مفيش.</div>';
  s+='<div style="margin-top:12px"><button class="b small" onclick="quickExtra(view)">+ إضافة خفيفة</button></div></div>';

  document.getElementById('s-today').innerHTML=s;
}

function row(t){
  const done=t.status==='done';
  return '<div class="item"><div class="tick '+(done?'on':'')+'" onclick="toggle(\''+t.id+'\')"></div>'+
    '<div class="itemBody"><div class="itemTitle '+(done?'done':'')+'">'+esc(t.title)+'</div>'+
    ((t.step||t.note)&&!done?'<div class="itemSub">'+esc(t.step||t.note)+'</div>':'')+
    (t.moved>=3&&!done?'<span class="flag">اتأجلت '+t.moved+' مرات</span>':'')+
    '</div><button class="dots" onclick="menu(\''+t.id+'\')" aria-label="خيارات">···</button></div>';
}

function renderWeek(){
  const s=[];
  for(let i=-1;i<7;i++){
    const x=parse(shiftDay(today(),i));
    const ds=iso(x), c=core(ds);
    const ex=extra(ds);
    s.push('<div class="day '+(ds===view?'today':'')+'">'+
      '<div class="dayRow"><div style="flex:1;min-width:0" onclick="jump(\''+ds+'\')">'+
        '<div class="dayHead"><span class="dayName">'+(i===-1?'امبارح':i===0?'النهارده':i===1?'بكرة':DAYS[x.getDay()])+' '+x.getDate()+' '+MON[x.getMonth()]+'</span></div>'+
        (c.length?'<div style="margin-top:4px;font-size:14px">'+c.map(t=>(t.status==='done'?'✓ ':'')+esc(t.title)).join('<br>')+'</div>'
                 :'<div class="muted" style="margin-top:4px">مفيش مهام أساسية</div>')+
        (ex.length?'<div class="muted" style="margin-top:4px">+ '+ex.length+' إضافي</div>':'')+
      '</div>'+
      '<button class="dayAdd" onclick="pickTemplate(\''+ds+'\')" aria-label="أضف">+</button>'+
      '</div></div>');
  }
  document.getElementById('s-week').innerHTML='<div class="muted" style="margin-bottom:8px">من امبارح لآخر الأسبوع. اضغط + عشان تضيف ليوم معين.</div>'+s.join('');
}

function renderLog(){
  const d=S.tasks.filter(t=>t.status==='done').slice(-40).reverse();
  let s='<div class="card"><div class="head"><h2>اللي خلصته</h2><span class="muted">'+d.length+'</span></div>';
  s+= d.length? d.map(t=>'<div class="item"><div class="tick on"></div><div class="itemBody">'+
      '<div class="itemTitle done">'+esc(t.title)+'</div>'+
      '<div class="itemSub">'+(t.doneAt||'')+(t.spent?' · '+Math.round(t.spent/60)+' دقيقة':'')+'</div></div></div>').join('')
    : '<div class="empty">لسه بدري. أول مهمة تخلصها هتظهر هنا.</div>';
  document.getElementById('s-log').innerHTML=s+'</div>';
}

function jump(d){view=d;render();go('today',document.querySelectorAll('.nb')[0])}

function start(id){
  if(timer)clearInterval(timer);
  tId=id; tSec=0;
  timer=setInterval(()=>{tSec++;renderToday()},1000);
  renderToday();
}
function stop(){
  if(timer)clearInterval(timer);
  const t=find(tId); if(t){t.spent=(t.spent||0)+tSec;save()}
  timer=null;tId=null;tSec=0;renderToday();
}
function done(id){
  const t=find(id); if(!t)return;
  if(tId===id){const x=find(tId);if(x)x.spent=(x.spent||0)+tSec;clearInterval(timer);timer=null;tId=null;tSec=0}
  t.status='done'; t.doneAt=today(); save(); render(); say('تمام.');
}
function toggle(id){
  const t=find(id); if(!t)return;
  if(t.status==='done'){t.status='todo';delete t.doneAt}
  else{t.status='done';t.doneAt=today()}
  save();render();
}

function delPhase(i){
  S.nextPhases.splice(i,1);

function phaseDragStart(e,idx){
  e.preventDefault();
  const list=document.getElementById('phaseList'); if(!list)return;
  const rows=[...list.querySelectorAll('.tplRow')];
  window._pDragIdx=idx;
  window._pDragStartY=e.clientY;
  window._pDragRowH=rows[0]?rows[0].getBoundingClientRect().height:44;
  const row=rows[idx];
  if(row){row.style.position='relative';row.style.zIndex='5';row.style.boxShadow='0 4px 14px rgba(32,38,43,.18)';row.style.borderRadius='10px'}
  document.addEventListener('pointermove',phaseDragMove);
  document.addEventListener('pointerup',phaseDragEnd);
}
function phaseDragMove(e){
  if(window._pDragIdx===undefined||window._pDragIdx===null)return;
  const list=document.getElementById('phaseList'); if(!list)return;
  const row=list.querySelectorAll('.tplRow')[window._pDragIdx];
  if(row)row.style.transform='translateY('+(e.clientY-window._pDragStartY)+'px)';
}
function phaseDragEnd(e){
  document.removeEventListener('pointermove',phaseDragMove);
  document.removeEventListener('pointerup',phaseDragEnd);
  if(window._pDragIdx===undefined||window._pDragIdx===null)return;
  const dy=e.clientY-window._pDragStartY;
  const steps=Math.round(dy/(window._pDragRowH||44));
  const arr=S.nextPhases;
  const fromIdx=window._pDragIdx;
  const newIdx=Math.max(0,Math.min(arr.length-1,fromIdx+steps));
  const[moved]=arr.splice(fromIdx,1);
  arr.splice(newIdx,0,moved);
  save();
  window._pDragIdx=null;
  render();
}

function pasteAdd(){
  const el=document.getElementById('pasteBox');
  const raw=(el?el.value:'').trim();
  if(!raw)return say('الصق حاجة الأول');
  let items=[];
  try{
    const j=JSON.parse(raw);
    items=Array.isArray(j)?j:(j&&Array.isArray(j.tasks)?j.tasks:[j]);
  }catch(e){
    items=raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split('|').map(x=>x.trim());
      return {title:p[0],step:p[1]||'',date:p[2]||''};
    });
  }
  let n=0;
  items.forEach(it=>{
    const title=(it&&it.title||'').trim();
    if(!title)return;
    let kind=it.kind||(it.date?'core':'inbox');
    if(['core','extra','inbox','waiting'].indexOf(kind)<0)kind='inbox';
    let date=it.date||'';
    if(kind==='waiting'||kind==='inbox')date='';
    if(kind==='core'&&core(date).length>=2)kind='extra';
    S.tasks.push({id:uid(),title:title,step:it.step||'',note:it.note||'',de:it.de||'',
      date:date,kind:kind,status:'todo',moved:0,spent:0,created:today()});
    n++;
  });
  if(!n)return say('مفيش مهام مفهومة في اللي لصقته');
  save();render();say(n===1?'اتضافت مهمة.':'اتضافت '+n+' مهام.');
}

function addTemplateOccurrence(t,date){
  let kind=t.kind||'extra';
  if(kind==='core'&&core(date).length>=2)kind='extra';
  S.tasks.push({id:uid(),title:t.title,step:t.step||'',note:t.note||'',de:t.de||'',
    date:date,kind:kind,status:'todo',moved:0,spent:0,created:today(),context:t.context||''});
  return kind;
}
function applyTemplate(id,date){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t||!date)return;
  const kind=addTemplateOccurrence(t,date);
  save();close_();render();
  say(t.title+' → '+dayLabel(date)+(kind==='extra'&&t.kind==='core'?' (إضافي)':''));
}
function applyTemplateRange(id,startDate,endDate){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t||!startDate)return;
  let end=endDate||startDate;
  if(end<startDate){const tmp=startDate;startDate=end;end=tmp}
  let d=startDate,n=0;
  while(d<=end&&n<60){addTemplateOccurrence(t,d);d=shiftDay(d,1);n++}
  save();close_();render();
  say(n<=1?(t.title+' → '+dayLabel(startDate)):('اتضافت لـ '+n+' يوم، من '+dayLabel(startDate)+'.'));
}

function moveTemplate(id,dir){
  const arr=sortedTemplates();const i=arr.findIndex(t=>t.id===id),j=i+dir;if(i<0||j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];arr.forEach((t,k)=>t.order=k);S.templates=arr;save();editTemplates();render();
}
function tplDragStart(e,id){
  e.preventDefault();
  const list=document.getElementById('tplList'); if(!list)return;
  const rows=[...list.querySelectorAll('.tplRow')];
  window._dragId=id;
  window._dragStartY=e.clientY;
  window._dragRowH=rows[0]?rows[0].getBoundingClientRect().height:44;
  window._dragCount=rows.length;
  const row=rows.find(r=>r.dataset.id===id);
  if(row){row.style.position='relative';row.style.zIndex='5';row.style.boxShadow='0 4px 14px rgba(32,38,43,.18)';row.style.borderRadius='10px'}
  document.addEventListener('pointermove',tplDragMove);
  document.addEventListener('pointerup',tplDragEnd);
}
function tplDragMove(e){
  if(!window._dragId)return;
  const list=document.getElementById('tplList'); if(!list)return;
  const row=list.querySelector('.tplRow[data-id="'+window._dragId+'"]');
  if(row)row.style.transform='translateY('+(e.clientY-window._dragStartY)+'px)';
}
function tplDragEnd(e){
  document.removeEventListener('pointermove',tplDragMove);
  document.removeEventListener('pointerup',tplDragEnd);
  if(!window._dragId)return;
  const dy=e.clientY-window._dragStartY;
  const steps=Math.round(dy/(window._dragRowH||44));
  const arr=sortedTemplates();
  const fromIdx=arr.findIndex(t=>t.id===window._dragId);
  if(fromIdx>-1){
    const newIdx=Math.max(0,Math.min(arr.length-1,fromIdx+steps));
    const[moved]=arr.splice(fromIdx,1);
    arr.splice(newIdx,0,moved);
    arr.forEach((t,i)=>t.order=i);
    S.templates=arr;
    save();
  }
  window._dragId=null;
  editTemplates();render();
}

    '<label for="fbBox">الإعدادات</label>'+
    '<textarea id="fbBox" placeholder=\'{"apiKey":"...","databaseURL":"https://....firebaseio.com", ...}\'></textarea>'+
    '<div class="stack"><button class="b main" onclick="saveSync()">احفظ وأعد التشغيل</button>'+
    '<button class="b quiet" onclick="close_()">إلغاء</button></div>');
}
function saveSync(){
  const el=document.getElementById('fbBox');
  const raw=(el?el.value:'').trim();
  if(!raw){localStorage.removeItem(FB_KEY);close_();say('المزامنة اتقفلت.');setTimeout(()=>location.reload(),900);return}
  let txt=raw.replace(/^[\s\S]*?firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'').trim();
  let cfg=null;
  try{cfg=JSON.parse(txt)}catch(e){
    try{cfg=(new Function('return ('+txt+')'))()}catch(e2){}
  }
  if(!cfg||!cfg.databaseURL)return say('مش لاقي databaseURL في اللي لصقته.');
  localStorage.setItem(FB_KEY,JSON.stringify(cfg));
  close_();say('اتحفظت. التطبيق هيفتح تاني.');
  setTimeout(()=>location.reload(),900);
}

function waitReceived(id){
  const t=find(id); if(!t)return;
  t.status='done'; t.doneAt=today(); t.pinned=false;
  save(); render(); say('اتقفلت.');
}
function waitToTask(id){
  const t=find(id); if(!t)return;
  t.pinned=false; close_();
  editor({id:t.id,title:t.title,step:'',date:view,kind:'core',status:'todo',moved:0},'حوّلها لمهمة');
}
function pinWait(id){
  waiting().forEach(t=>t.pinned=false);
  const t=find(id); if(t)t.pinned=true;
  save(); close_(); render(); say('اتثبّتت فوق.');
}
function unpinWait(id){
  const t=find(id); if(t)t.pinned=false;
  save(); close_(); render();
}

function monthKey(d){return (d||today()).slice(0,7)}
function countForTitle(title,month){
  return S.tasks.filter(t=>t.title===title&&t.status==='done'&&t.doneAt&&(!month||monthKey(t.doneAt)===month)).length;
}

function renderProgress(){
  const tracked=(S.templates||[]).filter(t=>t.tracked);
  const mo=monthKey(today());
  const moName=MON[parseInt(mo.split('-')[1],10)-1];
  let s='<div class="muted" style="margin-bottom:12px">عدد المرات اللي خلصتها فيها، من غير حكم على أي انقطاع.</div>';
  if(!tracked.length){
    s+='<div class="card"><div class="empty">مفيش حاجة بتتابعها دلوقتي.<br>من تاب الصندوق، افتح «تعديل القوالب» وحدد أي قالب عايز تتابعه.</div></div>';
  }else{
    s+=tracked.map(t=>{
      const mCount=countForTitle(t.title,mo), tCount=countForTitle(t.title,null);
      return '<div class="card"><div class="head"><h2>'+esc(t.title)+'</h2></div>'+
        '<div class="nowTitle" style="font-size:22px;margin-bottom:2px">'+mCount+'</div>'+
        '<div class="muted">مرة في '+esc(moName)+'</div>'+
        (tCount>mCount?'<div class="muted" style="margin-top:6px">من الأول: '+tCount+'</div>':'')+
        '</div>';
    }).join('');
  }
  document.getElementById('s-progress').innerHTML=s;
}

function toggleTrack(id){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t)return;
  t.tracked=!t.tracked;
  save();editTemplates();render();
}

function exportJson(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='MEIN_KOPF_'+today()+'.json'; a.click(); say('اتنزّلت.');
}
document.getElementById('picker').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x.tasks)throw 0;
      S.tasks=x.tasks.map(t=>({
        id:t.id||uid(),
        title:t.title||'',
        step:t.step||'',
        note:t.note||(t.notes?String(t.notes).split('\n').pop().replace(/^AR:\s*/,''):''),
        de:t.de||'',
        date:t.date||'',
        kind:t.kind||(t.type==='waiting'||t.status==='waiting'?'waiting':
              t.priority==='must1'||t.priority==='must2'?'core':
              t.priority==='optional'?'extra':'inbox'),
        status:t.status==='done'?'done':'todo',
        moved:t.moved||0, spent:t.spent||0, doneAt:t.doneAt||'', created:t.created||today()
      }));
      save();render();close_();say('اتستوردت.');
    }catch(e){say('الملف مش مظبوط.')}
  };
  r.readAsText(f); ev.target.value='';
});

render();

const FB_PATH='/mein_kopf';
function fbConfig(){
  try{const c=JSON.parse(localStorage.getItem(FB_KEY));if(c&&c.databaseURL)return c}catch(e){}
  return DEFAULT_FB;
}
let db;
try{
  const cfg=fbConfig();
  if(cfg&&cfg.databaseURL&&typeof firebase!=='undefined'){
    firebase.initializeApp(cfg);
    db=firebase.database();
    window._fbReady=true;
  }else{window._fbReady=false}
}catch(e){window._fbReady=false}

function startSync(){
  if(!window._fbReady)return;
  db.ref(FB_PATH).once('value').then(function(snap){
    const cloud=snap.val();
    if(cloud&&cloud.tasks&&cloud.tasks.length){
      S=cloud;if(!S.templates)S.templates=SEED.templates;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      render();
    }else{
      save();
    }
    db.ref(FB_PATH).on('value',function(s2){
      if(Date.now()-_lastSave<3000)return;
      const nd=s2.val();
      if(nd&&nd.tasks&&JSON.stringify(nd)!==JSON.stringify(S)){
        S=nd;if(!S.templates)S.templates=SEED.templates;
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        render();say('اتحدّثت من جهاز تاني.');
      }
    });
  }).catch(function(){});
}
startSync();
